version: 2
# One grouped PR per ecosystem per month. Keeps security updates flowing
# without flooding the branch list — each scan opens at most three PRs
# (cargo, nuget, github-actions) instead of one per dependency.
updates:
  - package-ecosystem: cargo
    directory: /dashboard
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      cargo-deps:
        patterns: ["*"]
    ignore:
      - dependency-name: eframe
        update-types: ["version-update:semver-major"]
      - dependency-name: egui
        update-types: ["version-update:semver-major"]
      - dependency-name: egui_kittest
        update-types: ["version-update:semver-major"]

  - package-ecosystem: nuget
    directory: /sensord/src
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      sensord-src-deps:
        patterns: ["*"]

  - package-ecosystem: nuget
    directory: /sensord/tests
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      sensord-tests-deps:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      actions-deps:
        patterns: ["*"]
