[package]
name = "perfwindow"
version = "0.9.4"
edition = "2021"
description = "PerfWindow — a lightweight Windows hardware monitor"
license = "MIT"

[lib]
name = "perfwindow"
path = "src/lib.rs"

[[bin]]
name = "PerfWindow"
path = "src/main.rs"

[dependencies]
eframe = "0.34.2"
egui = "0.34.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.2"
winreg = "0.56.0"
ureq = { version = "2.10", default-features = false, features = ["tls"] }
semver = "1"
thiserror = "2"
webbrowser = "1"

[build-dependencies]
winresource = "0.1.31"

[features]
# Exposes internal test-only constructors (e.g. `PerfApp::for_tests`) to
# integration tests under `tests/`. Enabled automatically when running the
# crate's own test binaries (see `[dev-dependencies]` below).
test-support = []

[dev-dependencies]
egui_kittest = { version = "0.34.2", features = ["snapshot", "wgpu"] }
perfwindow = { path = ".", features = ["test-support"] }

[profile.release]
opt-level = 3
# Diagnostic build profile for the 0.9.4 crash investigation. The two changes
# from a clean release build:
#   * `debug = true` keeps the function-name DWARF/PDB info inside the binary,
#     so a `panic.log` SEH crash address (an absolute pointer into PerfWindow.exe)
#     can be resolved back to a source location without a separate symbol drop.
#   * `lto = false` keeps function boundaries intact across crate-graph
#     edges so the resolved name actually points at the real culprit instead
#     of whatever blob LTO merged it into.
# Once the 0.9.x startup crash is identified and fixed, lto/strip can be
# restored.
debug = true
lto = false
strip = false
