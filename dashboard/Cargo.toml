[package]
name = "perfwindow"
version = "0.9.3"
edition = "2021"
description = "PerfWindow — a lightweight Windows hardware monitor"
license = "MIT"

[lib]
name = "perfwindow"
path = "src/lib.rs"

[[bin]]
name = "PerfWindow"
path = "src/main.rs"

[dependencies]
eframe = "0.34.2"
egui = "0.34.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.2"
winreg = "0.56.0"
ureq = { version = "2.10", default-features = false, features = ["tls"] }
semver = "1"
thiserror = "2"
webbrowser = "1"

[build-dependencies]
winresource = "0.1.31"

[features]
# Exposes internal test-only constructors (e.g. `PerfApp::for_tests`) to
# integration tests under `tests/`. Enabled automatically when running the
# crate's own test binaries (see `[dev-dependencies]` below).
test-support = []

[dev-dependencies]
egui_kittest = { version = "0.34.2", features = ["snapshot", "wgpu"] }
perfwindow = { path = ".", features = ["test-support"] }

[profile.release]
opt-level = 3
lto = true
strip = true
