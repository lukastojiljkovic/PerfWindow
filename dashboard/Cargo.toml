[package]
name = "perfwindow"
version = "0.2.5"
edition = "2021"
description = "PerfWindow — a lightweight Windows hardware monitor"
license = "MIT"

[[bin]]
name = "PerfWindow"
path = "src/main.rs"

[dependencies]
eframe = "0.34.2"
egui = "0.34.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.2"
winreg = "0.56.0"
ureq = { version = "2.10", default-features = false, features = ["tls"] }
semver = "1"
thiserror = "1"

[build-dependencies]
winresource = "0.1.31"

[profile.release]
opt-level = 3
lto = true
strip = true
